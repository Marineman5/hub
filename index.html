<style>
:root{
  --ink:#1A1A1A; --ink2:#4D4D4D; --ink3:#767676; --rule:#CCCCCC; --hair:#E6E6E6;
  --bg:#F2F2F2;
  --navy:#093BAE; --blue:#1D5BED; --mid:#6E94ED; --pale:#C6D4F6;
  --pad:72px; --lab:232px; --cell:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{width:auto;max-width:1160px;margin:0 auto;overflow-x:hidden;color:var(--ink);font-family:Inter,"Noto Sans JP",system-ui,sans-serif;
  font-feature-settings:"palt" 1;-webkit-font-smoothing:antialiased;line-height:1.7}
a{color:inherit;text-decoration:none}
a .lbl{transition:color .15s}
@media (hover:hover){ a:hover .lbl{color:var(--navy)} }
a:focus-visible{outline:2px solid var(--navy);outline-offset:4px}
a:focus-visible .lbl{color:var(--navy)}
ul{list-style:none}
.ar{display:inline-block;font-size:.58em;line-height:1;vertical-align:top;margin:.12em .38em 0 0;font-family:Inter,sans-serif}   /* R12: colour inherited, so it follows hover/focus */
.no{font-variant-numeric:tabular-nums}

header.top{padding:28px var(--pad) 0;font-size:13px;color:var(--ink2)}
header.top .id{font-weight:500;color:var(--ink)}

/* every block = label column + body column, separated by a hairline */
.row{display:grid;grid-template-columns:var(--lab) 1fr;margin:0 var(--pad);border-top:1px solid var(--rule);padding-top:20px}
.row > .k{font-size:12px;font-weight:400;letter-spacing:.14em;color:var(--ink2);padding-top:2px}
.row > .k h2{display:block;font-size:15px;font-weight:500;letter-spacing:.14em;color:var(--ink);margin-top:2px}

.idx{margin-top:140px}
.idx + .idx{margin-top:96px}
.idx table{width:100%;border-collapse:collapse}
.idx th{font-size:11px;letter-spacing:.14em;color:var(--ink2);font-weight:400;text-align:left;padding:0 0 12px}
.idx td{border-top:1px solid var(--rule);padding:26px 0 28px;vertical-align:baseline}
/* R15: closing rule removed (2/O review) */
.idx td.no{width:56px;font-size:12px;color:var(--ink2)}
.idx td.t{width:340px}
.idx .lbl{font-size:24px;font-weight:500;line-height:1.4}
.idx td.d{font-size:16px;color:var(--ink2);line-height:1.9}
/* R12: the whole row (rule to rule) is the link */
.idx tbody tr{position:relative}
.idx td.t a::after{content:"";position:absolute;inset:0}
.idx td.t a:focus-visible{outline:0}
.idx td.t a:focus-visible::after{outline:2px solid var(--navy);outline-offset:0}

footer.row{margin-top:160px;padding-bottom:72px}
/* R12: CONTACT = ul + p.c; 56px indent = the old empty dt column (links start at x=420, under the index titles) */
footer .b{padding-left:56px}
footer ul{display:flex;gap:48px;font-size:17px;margin:-9px 0}   /* the -9px cancels the links' 9px padding, so the text stays where it was */
footer li{display:flex}
footer li a{display:block;padding:9px 0}   /* tap box = line (27-29px) + 18px >= 44px */
footer .c{color:var(--ink2);font-size:15px;margin-top:14px}

/* R7: R6-A split; the right column holds only the dots of the motif, straight on the page background */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 576px;column-gap:48px;align-items:center;margin:150px var(--pad) 0}
.hero .motif{display:block}
.who{min-width:0}   /* R10b: the name never widens the 392px column (the wave stays put) */
.who h1{font-size:36px;line-height:1.15;font-weight:500;letter-spacing:-.04em;white-space:nowrap}   /* R12: line-height .92 -> 1.15 */
.who h1 .sep{margin:0 -.15em;color:var(--ink3)}
.who .sub{font-size:13px;color:var(--ink2);margin-top:12px}
.who .intro{font-size:16px;line-height:2;margin-top:32px}
.motif-sp{display:none}

/* R12: 1041-1159px keeps the PC split; the name shrinks with its column instead of running under the wave */
@media (max-width:1159px){
  :root{--pad:48px}
  .who h1{font-size:min(36px,calc((100vw - 2*var(--pad) - 624px)/10.8))}
}
/* R12: mid width (641-1040px): SP grammar (stacked) with PC type and the 576px wave */
@media (max-width:1040px){
  .hero{display:block;margin-top:96px}
  .hero .motif{margin-top:56px;max-width:100%;height:auto}   /* <672px only: scales down */
  .who h1{font-size:36px}
  .row{display:block}
  .idx table{margin-top:20px}
  footer .k{margin-bottom:20px}
}
/* R10: smartphone (<= 640px). PC (above) is untouched; the SP wave SVG is hidden on PC. */
@media (max-width:640px){
  :root{--pad:21px; --s:.9375}        /* 390 - 2x21 = 348 = 29 lattice columns; --s = one factor for the whole type ladder */
  header.top{padding-top:20px;font-size:calc(13px*var(--s))}

  .hero{display:block;margin-top:64px}
  .hero .motif{display:none}
  .hero .motif-sp{display:block;margin-top:56px;max-width:100%;height:auto}   /* <369px only: scales down (dots stop being whole pixels) */
  .who h1{font-size:min(36px,calc((100vw - 2*var(--pad))/11))}   /* R10b: one line in the text width */
  .who .sub{font-size:calc(13px*var(--s))}
  .who .intro{font-size:calc(16px*var(--s));margin-top:24px}

  .row{display:block;padding-top:16px}
  .row > .k{font-size:calc(12px*var(--s))}
  .row > .k h2{font-size:calc(15px*var(--s))}
  .idx{margin-top:72px}
  .idx + .idx{margin-top:56px}
  .idx table{margin-top:20px}
  .idx table, .idx thead, .idx tbody{display:block}
  .idx tr{display:grid;grid-template-columns:40px 1fr;align-items:baseline;border-top:1px solid var(--rule);padding:18px 0 20px}
  .idx thead tr{border-top:0;padding:0 0 10px}   /* the NO./TITLE head row: no rule above, like PC */
  .idx tbody tr:last-child{border-bottom:1px solid var(--rule)}
  .idx th{font-size:calc(11px*var(--s));padding:0}
  .idx th:last-child{display:none}            /* NOTE sits under TITLE, so its column head goes */
  .idx td{display:block;border:0;padding:0}   /* rules live on the row (tr), not the cells */
  .idx tbody tr:last-child td{border:0}       /* border only: padding stays with td.d (tbody raised this selector's weight) */
  .idx td.no{width:auto;font-size:calc(12px*var(--s))}
  .idx td.t{width:auto}
  .idx .lbl{font-size:calc(18px*var(--s))}
  .idx tr td.d{grid-column:2;padding-top:4px;font-size:calc(13px*var(--s));line-height:1.7;color:#6A6A6A}   /* R12: #767676 -> #6A6A6A (4.83:1 on #F2F2F2) */

  footer.row{margin-top:88px;padding-bottom:48px}
  footer .k{margin-bottom:20px}
  footer .b{padding-left:40px}
  footer ul{flex-direction:column;gap:0;font-size:calc(17px*var(--s))}
  footer .c{font-size:calc(15px*var(--s))}
}
</style>
